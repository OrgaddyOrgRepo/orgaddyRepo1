<template>
    <lightning-card title="Select Account" icon-name = "standard:account">
       <div>
           
         <lightning-input onchange={searchme} class="slds-m-bottom_small"></lightning-input>
        
      </div>
         
    </lightning-card>
    <lightning-card title="Related Contacts" icon-name="standard:contact">
         <lightning-datatable key-field="id"
                            class="datatable"
                            data={acc_contacts.data}
                             columns = {col}
                             show-row-number-column = "true"
                             onrowaction = {handleRowAction}
                            >
                            </lightning-datatable>

        <lightning-layout horizontal-align="space">
            <lightning-layout-item flexibility="auto">
                <lightning-button label="Previous" icon-name="utility:chevronleft" onclick={previousHandler}>
                </lightning-button>
            </lightning-layout-item>
            <lightning-layout-item flexibility="auto">
                Page {page} of {totalPage}
            </lightning-layout-item>
            <lightning-layout-item flexibility="auto">
                <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right"
                    onclick={nextHandler}></lightning-button>
            </lightning-layout-item>
        </lightning-layout>


      <!-- 
          <aura:handler name="init" value="{!this}" action="{!c.functionName}" /><aura:handler name="init" value="{!this}" action="{!c.functionName}" /> <c-do-pagination
        records={acc_contacts}
        show-table="true"
        columns={col}
        recordsperpage="4">
       </c-do-pagination> 
       onactions={handleRowActions}
        onpagination={handlePagination}
    -->
   
    </lightning-card>
</template>
