<template>
    <lightning-card title="Upload File to SharePoint">
        <div class="slds-m-around_medium">
            <!-- <lightning-input label="Customer ID" value={accountId} onchange={handleAccountNameChange}></lightning-input> -->
            <lightning-input label="File Name" value={fileName} onchange={handleFileNameChange}></lightning-input>
            <lightning-input type="file" label="Select File" onchange={handleFileChange}></lightning-input>
            <lightning-button label="Upload" onclick={handleUpload} class="slds-m-top_medium"></lightning-button>
        </div>
    </lightning-card>
</template>
