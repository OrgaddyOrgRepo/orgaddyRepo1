<template>
<lightning-card>
        <lightning-button variant="neutral" label="Toggle Tables" title="Toggle between standard and Custom Table" onclick={handleClick}></lightning-button>
        <template if:false ={showCustom}>
                <em>This is standard datatable </em>
                <lightning-datatable
                        key-field="id"
                        data={data}
                        hide-checkbox-column
                        columns={columns}
                        class="slds-scrollable_y slds-scrollable_x"
                        >
                </lightning-datatable> 
                <!-- <lightning-input type="text" variant="standard" name="Quality" label="Quality"  value={value} placeholder="type here..." onclick={handleInput}></lightning-input>
                <lightning-input type="text" variant="standard" name="Design" label="Design" value={value} placeholder="type here..." onclick={handleInput}></lightning-input>
                <lightning-input type="text" variant="standard" name="Shade" label="Shade" value={value} placeholder="type here..." onclick={handleInput}></lightning-input> -->
                <div class="slds-align_absolute-center">
                        <lightning-button  variant="success" label="Add Item To Cart" title="My Button" onclick={addItemHandler}></lightning-button>
                </div>
        </template>
        <template if:true ={showCustom}>
                 <em>This is custom datatable </em>
                <div>
                        <table>
                                <th>
                                        <template for:each={COLUMNS} for:item="col">
                                                <th key={col.label}>{col.label}</th>
                                        </template>
                                </th>
                                <tbody>
                                        <template for:each={data} for:item="rec">
                                                <tr key={rec}>
                                                        <template for:each={columns} for:item="col" for:index="index">
                                                                <td key={col.value}>{col.value}</td>
                                                        </template>
                                                </tr>
                                        </template>
                                </tbody>
                        </table>
                </div>
        </template>
        
</lightning-card>
                    
</template>
